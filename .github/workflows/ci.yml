name: CI

on:
  push:
  pull_request:

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # Composer haalt made-cms-package van GitHub, op dev-main (#28). De repo is privé, dus Composer kloont hem
      # over SSH met een read-only deploy key, op de commit die composer.lock noemt. Geen --prefer-dist: dat
      # overschrijft preferred-install in composer.json, en dan probeert Composer de zip via de API zonder token.
      - name: Deploy key van made-cms-package klaarzetten
        env:
          DEPLOY_KEY: ${{ secrets.MADE_CMS_PACKAGE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/made_cms_package
          chmod 600 ~/.ssh/made_cms_package
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/made_cms_package -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Composer-dependencies installeren
        run: composer install --no-interaction --no-progress

      - name: Codestijl controleren
        run: vendor/bin/pint --test

  tests:
    name: Pest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Omgeving voorbereiden
        run: cp .env.example .env

      # Composer haalt made-cms-package van GitHub, op dev-main (#28). De repo is privé, dus Composer kloont hem
      # over SSH met een read-only deploy key, op de commit die composer.lock noemt. Geen --prefer-dist: dat
      # overschrijft preferred-install in composer.json, en dan probeert Composer de zip via de API zonder token.
      - name: Deploy key van made-cms-package klaarzetten
        env:
          DEPLOY_KEY: ${{ secrets.MADE_CMS_PACKAGE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/made_cms_package
          chmod 600 ~/.ssh/made_cms_package
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/made_cms_package -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Composer-dependencies installeren
        run: composer install --no-interaction --no-progress

      - name: Applicatiesleutel genereren
        run: php artisan key:generate

      - name: npm-dependencies installeren
        run: npm ci

      - name: Assets bouwen
        run: npm run build

      - name: Tests draaien
        run: php artisan test --compact
